{% extends "base.html" %}

{% block title_suffix %} - Round {{ game.round_number }}{% endblock %}

{% block head %}
<script src="/static/js/spotify-player.js"></script>
<script src="https://sdk.scdn.co/spotify-player.js"></script>
{% endblock %}

{% block content %}
<div id="game-messages" class="message-pane" aria-live="polite">
    <p id="player-status" class="message message--status">
        <span id="player-status-text">Connecting to Spotify...</span>
        <span id="player-controls" class="player-controls hidden">
            <button type="button" id="play-toggle" aria-label="Pause" title="Pause">&#x23F8;&#xFE0E;</button>
            <span id="elapsed" class="elapsed" role="timer">0:00</span>
        </span>
        <button type="button" id="start-music" class="hidden">Tap to start the music</button>
    </p>
</div>

<!-- Submitted by the JS once the player is ready. Later rounds are swapped
     in without a reload and trigger playback themselves, reusing this device. -->
<form id="play-track-form" class="hidden" hx-post="/game/play-track" hx-swap="none">
    <input type="hidden" name="device_id" id="device-id" value="">
</form>

<div id="round">
    {% include "partials/round.html" %}
</div>

<hr>
<form action="/game/end" method="post" class="section-gap" data-fade-out>
    <button type="submit">End Game</button>
</form>

{% endblock %}
