{% if error is defined and error %}
<p><strong>Error:</strong> {{ error }}</p>
{% endif %}

{% if track_count is defined and track_count > 0 %}
<p>Playlist loaded: {{ track_count }} tracks</p>
<div id="enrichment-status"
     hx-get="/lobby/enrichment-status"
     hx-trigger="load delay:2s"
     hx-swap="outerHTML">
    <small>Fetching original release years...</small>
</div>
{% endif %}
