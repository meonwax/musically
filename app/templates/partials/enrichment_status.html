{% if enrichment_done %}
<div id="enrichment-status">
    <small>Release years verified ({{ track_count }} tracks)</small>
</div>
{% else %}
<div id="enrichment-status"
     hx-get="/lobby/enrichment-status"
     hx-trigger="load delay:2s"
     hx-swap="outerHTML">
    <small>Fetching original release years...</small>
</div>
{% endif %}
